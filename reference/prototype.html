<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>말씀 암송 – 1단계·2단계</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400;600&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f1f4f3; --panel:#fbfcfc; --ink:#1f2d36; --muted:#5c6c76; --line:#d3dcdf;
  --acc:#b23a5a; --acc-ink:#ffffff; --hot:#d98a1f; --bad:#b8402f; --good:#2f7a4f; --blank:#9db0b8;
}
:root[data-stage="2"]{ --acc:#3f7d3a; --acc-ink:#ffffff; }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10181d; --panel:#18232a; --ink:#e6eef1; --muted:#93a4ad; --line:#2a3943;
    --acc:#f08aa3; --acc-ink:#2a0f18; --hot:#f0b252; --bad:#ef7f6c; --good:#6fcf97; --blank:#566a74;
  }
  :root:not([data-theme="light"])[data-stage="2"]{ --acc:#8fd17f; --acc-ink:#10260c; }
}
:root[data-theme="dark"]{
  --bg:#10181d; --panel:#18232a; --ink:#e6eef1; --muted:#93a4ad; --line:#2a3943;
  --acc:#f08aa3; --acc-ink:#2a0f18; --hot:#f0b252; --bad:#ef7f6c; --good:#6fcf97; --blank:#566a74;
}
:root[data-theme="dark"][data-stage="2"]{ --acc:#8fd17f; --acc-ink:#10260c; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:16px;line-height:1.6}
button,textarea,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
.app{max-width:1080px;margin:0 auto;padding:18px 14px 48px;display:grid;grid-template-columns:270px 1fr;gap:18px}
header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font-family:"Noto Serif KR",serif;font-weight:600;font-size:26px}
.sub{color:var(--muted);font-size:13px}
.tabs{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.tabs button{background:none;border:0;padding:9px 16px;font-weight:500;border-right:1px solid var(--line);text-align:left;line-height:1.3}
.tabs button:last-child{border-right:0}
.tabs button small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.tabs button[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink)}
.tabs button[aria-pressed="true"] small{color:inherit;opacity:.85}
.theme{background:none;border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:13px;color:var(--muted)}

.next{grid-column:1/-1;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--acc);border-radius:10px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.next b{font-weight:700}

aside{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;align-self:start}
.bar{height:6px;background:var(--bg);border-radius:6px;margin:4px 6px 8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);width:0}
.plist{list-style:none;margin:0;padding:0}
.plist button{width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:8px 10px;display:flex;gap:10px;align-items:center}
.plist button:hover{background:var(--bg)}
.plist button[aria-current="true"]{background:var(--ink);color:var(--bg)}
.plist .no{flex:0 0 22px;font-size:13px;color:var(--muted);text-align:right}
.plist button[aria-current="true"] .no{color:var(--bg);opacity:.8}
.plist .rf{flex:1}
.plist .ck{flex:0 0 auto;font-size:12px;color:var(--good)}
.plist button[aria-current="true"] .ck{color:var(--hot)}
.plist .nx{font-size:11px;color:var(--acc);border:1px solid var(--acc);border-radius:10px;padding:0 6px}

main{display:flex;flex-direction:column;gap:14px;min-width:0}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px 22px}
.ref{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.ref h2{margin:0;font-family:"Noto Serif KR",serif;font-size:24px;font-weight:600}
.ref .meta{font-size:13px;color:var(--muted)}
.rng{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px;font-size:14px}
.rng select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
.verse{margin:0 0 16px}
.vs{display:flex;gap:10px;margin:0 0 8px;font-family:"Noto Serif KR",serif;font-size:clamp(19px,2.6vw,24px);line-height:1.75}
.vn{flex:0 0 30px;font-family:"Noto Sans KR",sans-serif;font-size:13px;color:var(--acc);text-align:right;padding-top:.55em;font-weight:700}
.vt{flex:1;min-width:0;word-break:keep-all}
.w{border-radius:4px}
.w.blank{color:transparent;border-bottom:2px solid var(--blank);cursor:pointer;background:none;border-top:0;border-left:0;border-right:0;padding:0;font:inherit;line-height:inherit}
.w.blank:hover{background:color-mix(in srgb,var(--hot) 22%,transparent)}
.w.shown{color:var(--hot)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.lbl{font-size:13px;color:var(--muted);margin-right:4px}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-weight:500}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.btn.stop{background:var(--bad);color:#fff;border-color:var(--bad)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:none;border:0;padding:7px 11px;border-right:1px solid var(--line);font-size:14px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.panels{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px}
.card h3{margin:0;font-size:16px;font-weight:700}
.hint{margin:0;font-size:13px;color:var(--muted)}
textarea{width:100%;min-height:110px;resize:vertical;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;font-family:"Noto Serif KR",serif;font-size:18px;line-height:1.7}
.rwords{font-family:"Noto Serif KR",serif;font-size:19px;line-height:1.9;word-break:keep-all}
.rwords .ok{color:var(--good)}
.rwords .miss{color:var(--bad);text-decoration:underline wavy}
.score{font-size:14px;color:var(--muted)}
.chk{display:flex;align-items:center;gap:8px;font-size:15px}
.chk input{width:20px;height:20px;accent-color:var(--acc)}
.file{font-size:13px;color:var(--muted)}
.toast{font-size:14px;color:var(--good);min-height:1.2em}
@media (max-width:840px){
  .app{grid-template-columns:1fr}
  .panels{grid-template-columns:1fr}
  aside{padding:6px}
  .plist{display:flex;overflow-x:auto;gap:4px}
  .plist button{white-space:nowrap}
  .stage{padding:16px 14px}
  .vn{flex-basis:24px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>말씀 암송</h1>
      <div class="sub">1단계 → 2단계 순서대로 · 본문은 교재 사진에서 옮겨 적었어요. 틀린 글자가 있으면 알려주세요.</div>
    </div>
    <div class="row">
      <div class="tabs" id="stageTabs" role="group" aria-label="단계 선택"></div>
      <button class="theme" id="themeBtn" type="button">밝게 / 어둡게</button>
    </div>
  </header>

  <div class="next" id="nextBox"></div>

  <aside aria-label="구절 목록">
    <div class="bar" aria-hidden="true"><i id="barFill"></i></div>
    <ul class="plist" id="plist"></ul>
  </aside>

  <main>
    <section class="stage" aria-live="polite">
      <div class="ref">
        <h2 id="refTitle"></h2>
        <span class="meta" id="metaInfo"></span>
      </div>
      <div class="rng" id="rngBox">
        <span class="lbl">연습할 범위</span>
        <select id="selFrom" aria-label="시작 절"></select>
        <span>절 ~</span>
        <select id="selTo" aria-label="끝 절"></select>
        <span>절</span>
        <button class="btn" id="rngAll" type="button">전체</button>
      </div>
      <div class="verse" id="verse"></div>
      <div class="row">
        <span class="lbl">단어 가리기</span>
        <div class="seg" id="levelSeg" role="group" aria-label="단어 가리기"></div>
        <button class="btn" id="revealAll" type="button">모두 보기</button>
      </div>
    </section>

    <div class="panels">
      <section class="card" aria-labelledby="h-listen">
        <h3 id="h-listen">1. 듣고 따라 읽기</h3>
        <div class="row">
          <span class="lbl">반복</span>
          <div class="seg" id="repSeg" role="group" aria-label="반복 횟수"></div>
        </div>
        <div class="row">
          <span class="lbl">속도</span>
          <div class="seg" id="rateSeg" role="group" aria-label="속도"></div>
        </div>
        <label class="chk"><input type="checkbox" id="shadow"> 한 번 들은 뒤 멈춰서 따라 읽을 시간 주기</label>
        <div class="row">
          <button class="btn primary" id="playBtn" type="button">재생</button>
          <span class="score" id="playState"></span>
        </div>
        <div class="file">
          <label>다른 MP3로 바꾸기 (선택): <input type="file" id="mp3" accept="audio/*"></label>
          <p class="hint" id="audioNote"></p>
        </div>
      </section>

      <section class="card" aria-labelledby="h-recite">
        <h3 id="h-recite">2. 외워서 말해 보기</h3>
        <p class="hint">기억나는 대로 적거나, 마이크 버튼을 눌러 소리 내어 말한 뒤 확인하세요.</p>
        <textarea id="attempt" placeholder="외운 말씀을 적어 보세요…" aria-label="외운 내용"></textarea>
        <div class="row">
          <button class="btn primary" id="checkBtn" type="button">확인</button>
          <button class="btn" id="micBtn" type="button">말하기</button>
          <button class="btn" id="clearBtn" type="button">지우기</button>
        </div>
        <div id="result"></div>
        <label class="chk"><input type="checkbox" id="done"> 이 구절을 암송했어요</label>
        <div class="row">
          <button class="btn" id="prevBtn" type="button">◀ 이전 구절</button>
          <button class="btn primary" id="nextBtn" type="button">다음 구절 ▶</button>
        </div>
        <div class="toast" id="toast"></div>
      </section>
    </div>
  </main>
</div>

<script>
(function(){
  /* 형식: "절번호|본문". m = 교재의 구절 옆 표시(Ⓐ, *) */
  var DATA = {
  1:[
   {r:"고린도전서 13:1-13", m:"Ⓐ*", v:[
    "1|내가 사람의 방언과 천사의 말을 할지라도 사랑이 없으면 소리 나는 구리와 울리는 꽹과리가 되고",
    "2|내가 예언하는 능력이 있어 모든 비밀과 모든 지식을 알고 또 산을 옮길 만한 모든 믿음이 있을지라도 사랑이 없으면 내가 아무것도 아니요",
    "3|내가 내게 있는 모든 것으로 구제하고 또 내 몸을 불사르게 내줄지라도 사랑이 없으면 내게 아무 유익이 없느니라",
    "4|사랑은 오래 참고 사랑은 온유하며 시기하지 아니하며 사랑은 자랑하지 아니하며 교만하지 아니하며",
    "5|무례히 행하지 아니하며 자기의 유익을 구하지 아니하며 성내지 아니하며 악한 것을 생각하지 아니하며",
    "6|불의를 기뻐하지 아니하며 진리와 함께 기뻐하고",
    "7|모든 것을 참으며 모든 것을 믿으며 모든 것을 바라며 모든 것을 견디느니라",
    "8|사랑은 언제까지나 떨어지지 아니하되 예언도 폐하고 방언도 그치고 지식도 폐하리라",
    "9|우리는 부분적으로 알고 부분적으로 예언하니",
    "10|온전한 것이 올 때에는 부분적으로 하던 것이 폐하리라",
    "11|내가 어렸을 때에는 말하는 것이 어린아이와 같고 깨닫는 것이 어린아이와 같고 생각하는 것이 어린아이와 같다가 장성한 사람이 되어서는 어린아이의 일을 버렸노라",
    "12|우리가 지금은 거울로 보는 것같이 희미하나 그때에는 얼굴과 얼굴을 대하여 볼 것이요 지금은 내가 부분적으로 아나 그때에는 주께서 나를 아신 것같이 내가 온전히 알리라",
    "13|그런즉 믿음, 소망, 사랑, 이 세 가지는 항상 있을 것인데 그중의 제일은 사랑이라"]},
   {r:"신명기 6:4-9 (쉐마)", m:"", v:[
    "4|이스라엘아 들으라 우리 하나님 여호와는 오직 유일한 여호와이시니",
    "5|너는 마음을 다하고 뜻을 다하고 힘을 다하여 네 하나님 여호와를 사랑하라",
    "6|오늘 내가 네게 명하는 이 말씀을 너는 마음에 새기고",
    "7|네 자녀에게 부지런히 가르치며 집에 앉았을 때에든지 길을 갈 때에든지 누워 있을 때에든지 일어날 때에든지 이 말씀을 강론할 것이며",
    "8|너는 또 그것을 네 손목에 매어 기호를 삼으며 네 미간에 붙여 표로 삼고",
    "9|또 네 집 문설주와 바깥 문에 기록할지니라"]},
   {r:"로마서 3:23,24", m:"", v:[
    "23|모든 사람이 죄를 범하였으매 하나님의 영광에 이르지 못하더니",
    "24|그리스도 예수 안에 있는 속량으로 말미암아 하나님의 은혜로 값 없이 의롭다 하심을 얻은 자 되었느니라"]},
   {r:"갈라디아서 2:20", m:"", v:[
    "20|내가 그리스도와 함께 십자가에 못 박혔나니 그런즉 이제는 내가 사는 것이 아니요 오직 내 안에 그리스도께서 사시는 것이라 이제 내가 육체 가운데 사는 것은 나를 사랑하사 나를 위하여 자기 자신을 버리신 하나님의 아들을 믿는 믿음 안에서 사는 것이라"]},
   {r:"마태복음 7:7-14", m:"", v:[
    "7|구하라 그리하면 너희에게 주실 것이요 찾으라 그리하면 찾아낼 것이요 문을 두드리라 그리하면 너희에게 열릴 것이니",
    "8|구하는 이마다 받을 것이요 찾는 이는 찾아낼 것이요 두드리는 이에게는 열릴 것이니라",
    "9|너희 중에 누가 아들이 떡을 달라 하는데 돌을 주며",
    "10|생선을 달라 하는데 뱀을 줄 사람이 있겠느냐",
    "11|너희가 악한 자라도 좋은 것으로 자식에게 줄 줄 알거든 하물며 하늘에 계신 너희 아버지께서 구하는 자에게 좋은 것으로 주시지 않겠느냐",
    "12|그러므로 무엇이든지 남에게 대접을 받고자 하는 대로 너희도 남을 대접하라 이것이 율법이요 선지자니라",
    "13|좁은 문으로 들어가라 멸망으로 인도하는 문은 크고 그 길이 넓어 그리로 들어가는 자가 많고",
    "14|생명으로 인도하는 문은 좁고 길이 협착하여 찾는 자가 적음이라"]},
   {r:"시편 1:1-6", m:"Ⓐ*", v:[
    "1|복 있는 사람은 악인들의 꾀를 따르지 아니하며 죄인들의 길에 서지 아니하며 오만한 자들의 자리에 앉지 아니하고",
    "2|오직 여호와의 율법을 즐거워하여 그의 율법을 주야로 묵상하는도다",
    "3|그는 시냇가에 심은 나무가 철을 따라 열매를 맺으며 그 잎사귀가 마르지 아니함 같으니 그가 하는 모든 일이 다 형통하리로다",
    "4|악인들은 그렇지 아니함이여 오직 바람에 나는 겨와 같도다",
    "5|그러므로 악인들은 심판을 견디지 못하며 죄인들이 의인들의 모임에 들지 못하리로다",
    "6|무릇 의인들의 길은 여호와께서 인정하시나 악인들의 길은 망하리로다"]},
   {r:"시편 23:1-6", m:"Ⓐ*", v:[
    "1|여호와는 나의 목자시니 내게 부족함이 없으리로다",
    "2|그가 나를 푸른 풀밭에 누이시며 쉴 만한 물 가로 인도하시는도다",
    "3|내 영혼을 소생시키시고 자기 이름을 위하여 의의 길로 인도하시는도다",
    "4|내가 사망의 음침한 골짜기로 다닐지라도 해를 두려워하지 않을 것은 주께서 나와 함께 하심이라 주의 지팡이와 막대기가 나를 안위하시나이다",
    "5|주께서 내 원수의 목전에서 내게 상을 차려 주시고 기름을 내 머리에 부으셨으니 내 잔이 넘치나이다",

  }
  function renderControls(){
    seg("levelSeg",LEVELS,LEVELS[level],function(x){return x+"%"},function(x){level=LEVELS.indexOf(x);revealed={};renderControls();renderVerse()});
    seg("repSeg",REPS,rep,function(x){return x+"번"},function(x){rep=x;renderControls()});
    seg("rateSeg",RATES,rate,function(x){return x+"배"},function(x){rate=x;renderControls()});
    $("shadow").checked=shadow;
    $("done").checked=!!done[key(stage,idx)];
    var kk=key(stage,idx), note;
    if(urls[kk])note="올려 주신 MP3로 재생돼요.";
    else if(AUDIO[kk]&&isFullRange())note="녹음된 음성으로 재생돼요.";
    else if(AUDIO[kk])note="일부 절만 연습할 때는 녹음 대신 기기의 한국어 음성이 읽어 줘요. 전체를 선택하면 녹음으로 들려요.";
    else note="이 구절은 아직 녹음이 없어서 기기의 한국어 음성이 읽어 줘요.";
    $("audioNote").textContent=note;
    $("prevBtn").disabled=!seqPrev();
    $("nextBtn").disabled=!seqNext();
  }
  function renderAll(){renderTabs();renderNext();renderList();renderRange();renderVerse();renderControls()}

  function goto(s,i){
    stop();stage=s;idx=i;revealed={};resetRange();
    $("attempt").value="";$("result").innerHTML="";$("toast").textContent="";$("mp3").value="";
    save();renderAll();
  }

  /* ---------- 소리 ---------- */
  function setPlaying(on,msg){
    playing=on;
    var b=$("playBtn");b.textContent=on?"멈춤":"재생";b.className="btn "+(on?"stop":"primary");
    $("playState").textContent=msg||"";
  }
  function pending(fn){return new Promise(function(res){cancelFn=res;fn(res)})}
  function stop(){
    token++;
    if(cancelFn){var f=cancelFn;cancelFn=null;f()}
    if(timer){clearTimeout(timer);timer=null}
    if(audio){try{audio.pause()}catch(e){}audio=null}
    if("speechSynthesis" in window){try{speechSynthesis.cancel()}catch(e){}}
    setPlaying(false,"");
  }
  function koVoice(){
    try{var vs=speechSynthesis.getVoices();return vs.filter(function(x){return /^ko/i.test(x.lang)})[0]||null}catch(e){return null}
  }
  function fullText(){return active().map(function(v){return v.t}).join(" ")}
  function isFullRange(){var vs=parse(P());return from===vs[0].n&&to===vs[vs.length-1].n}
  function audioUrl(){
    var k=key(stage,idx);
    if(urls[k])return urls[k];
    if(AUDIO[k]&&isFullRange())return AUDIO[k];
    return null;
  }
  function playOnce(){
    var u=audioUrl();
    if(u){
      return pending(function(res){
        audio=new Audio(u);audio.playbackRate=rate;
        audio.onended=res;audio.onerror=res;
        audio.play().catch(res);
      });
    }
    if(!("speechSynthesis" in window))return Promise.resolve();
    return pending(function(res){
      var ut=new SpeechSynthesisUtterance(fullText());
      ut.lang="ko-KR";ut.rate=rate;
      var v=koVoice();if(v)ut.voice=v;
      ut.onend=res;ut.onerror=res;
      speechSynthesis.cancel();speechSynthesis.speak(ut);
    });
  }
  function wait(ms){return pending(function(res){timer=setTimeout(function(){timer=null;res()},ms)})}
  async function run(){
    var my=++token;
    setPlaying(true,"");
    if(!audioUrl()&&"speechSynthesis" in window&&!koVoice()){
      $("playState").textContent="이 기기에 한국어 음성이 없어요. MP3를 올려 주세요.";
    }
    var wc=words(fullText()).length;
    for(var i=0;i<rep;i++){
      if(my!==token)return;
      if(audioUrl()||koVoice())$("playState").textContent=rep+"번 중 "+(i+1)+"번째 듣는 중";
      await playOnce();
      if(my!==token)return;
      if(shadow){
        $("playState").textContent="따라 읽어 보세요";
        await wait(Math.max(2500,wc*450/rate));
      }else if(i<rep-1){await wait(600)}
    }
    if(my===token)setPlaying(false,"끝났어요");
  }

  /* ---------- 확인 ---------- */
  function check(){
    var target=words(fullText()), got=words($("attempt").value).map(norm).filter(Boolean);
    var box=$("result");box.innerHTML="";
    if(!got.length){box.innerHTML='<span class="score">먼저 외운 내용을 적거나 말해 주세요.</span>';return}
    var t=target.map(norm), n=t.length, m=got.length, dp=[], i, j;
    for(i=0;i<=n;i++)dp.push(new Array(m+1).fill(0));
    for(i=1;i<=n;i++)for(j=1;j<=m;j++){
      dp[i][j]=t[i-1]===got[j-1]?dp[i-1][j-1]+1:Math.max(dp[i-1][j],dp[i][j-1]);
    }
    var ok=new Array(n).fill(false);i=n;j=m;
    while(i>0&&j>0){
      if(t[i-1]===got[j-1]){ok[i-1]=true;i--;j--}
      else if(dp[i-1][j]>=dp[i][j-1])i--;else j--;
    }
    var hit=ok.filter(Boolean).length, pct=Math.round(hit/n*100);
    var rw=document.createElement("div");rw.className="rwords";
    target.forEach(function(w,k){
      var s=document.createElement("span");s.className=ok[k]?"ok":"miss";s.textContent=w;
      rw.appendChild(s);rw.appendChild(document.createTextNode(" "));
    });
    var sc=document.createElement("div");sc.className="score";
    sc.textContent=n+"단어 중 "+hit+"단어 맞음 ("+pct+"%)"+(pct===100?" – 완벽해요!":"");
    box.appendChild(rw);box.appendChild(sc);
  }
  var rec=null;
  function mic(){
    var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){$("result").innerHTML='<span class="score">이 브라우저는 음성 입력을 지원하지 않아요. 직접 적어 주세요.</span>';return}
    if(rec){try{rec.stop()}catch(e){}return}
    try{
      rec=new SR();rec.lang="ko-KR";rec.interimResults=true;rec.continuous=true;
      rec.onresult=function(e){
        var s="";for(var k=0;k<e.results.length;k++)s+=e.results[k][0].transcript+" ";
        $("attempt").value=s.trim();
      };
      rec.onend=function(){rec=null;$("micBtn").textContent="말하기";check()};
      rec.onerror=function(){rec=null;$("micBtn").textContent="말하기";
        $("result").innerHTML='<span class="score">마이크를 켤 수 없어요. 마이크 권한을 허용하거나 직접 적어 주세요.</span>'};
      rec.start();$("micBtn").textContent="말하기 끝내고 확인";
    }catch(e){rec=null}
  }

  /* ---------- 이벤트 ---------- */
  $("playBtn").onclick=function(){playing?stop():run()};
  $("shadow").onchange=function(e){shadow=e.target.checked};
  $("revealAll").onclick=function(){
    var n=0;active().forEach(function(v){n+=words(v.t).length});
    revealed={};for(var i=0;i<n;i++)revealed[i]=true;renderVerse();
  };
  $("selFrom").onchange=function(e){
    from=+e.target.value;if(to<from)to=from;revealed={};stop();renderRange();renderVerse();renderControls();
  };
  $("selTo").onchange=function(e){
    to=+e.target.value;if(from>to)from=to;revealed={};stop();renderRange();renderVerse();renderControls();
  };
  $("rngAll").onclick=function(){resetRange();revealed={};stop();renderRange();renderVerse();renderControls()};
  $("checkBtn").onclick=check;
  $("micBtn").onclick=mic;
  $("clearBtn").onclick=function(){$("attempt").value="";$("result").innerHTML=""};
  $("done").onchange=function(e){
    done[key(stage,idx)]=e.target.checked;save();
    renderTabs();renderNext();renderList();
    $("toast").textContent=e.target.checked?"암송 완료로 표시했어요. 아래 '다음 구절'로 이어가세요.":"";
  };
  $("prevBtn").onclick=function(){var p=seqPrev();if(p)goto(p.s,p.i)};
  $("nextBtn").onclick=function(){var p=seqNext();if(p)goto(p.s,p.i)};
  $("mp3").onchange=function(e){
    var f=e.target.files&&e.target.files[0];if(!f)return;
    var k=key(stage,idx);if(urls[k])URL.revokeObjectURL(urls[k]);
    urls[k]=URL.createObjectURL(f);renderControls();
  };
  $("themeBtn").onclick=function(){
    var r=document.documentElement,dark=getComputedStyle(r).getPropertyValue("--bg").trim()==="#10181d";
    r.setAttribute("data-theme",dark?"light":"dark");
  };

  load();
  var nt0=nextTodo();
  try{if(!localStorage.getItem("gs:pos")&&nt0){stage=nt0.s;idx=nt0.i}}catch(e){}
  resetRange();renderAll();
  if("speechSynthesis" in window){try{speechSynthesis.getVoices()}catch(e){}}
})();
</script>
</body>
</html>
